services:
  # ── Bizora Voice Backend (FastAPI / Python) ───────────────────────────
  - type: web
    name: bizora-voice-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres:ibH%25eV6Yt%23ngh_D@db.vsmlvtrwgkpwxwhatbhx.supabase.co:5432/postgres
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: bizora-voice-backend
          property: host
      - key: SUPABASE_URL
        value: https://vsmlvtrwgkpwxwhatbhx.supabase.co
      - key: SUPABASE_KEY
        value: sb_publishable_rbGRKU6uSNzFJBZNBxPnbQ_QjdNbWVZ

  # ── Vaani Voice Static Frontend (Instant Global CDN, Zero Cold Starts) ───
  - type: static
    name: bizora-voice-static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: bizora-voice-backend
          property: host
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://vsmlvtrwgkpwxwhatbhx.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_rbGRKU6uSNzFJBZNBxPnbQ_QjdNbWVZ


