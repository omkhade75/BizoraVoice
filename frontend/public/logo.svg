<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="2" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#innerGlow)" />

  <!-- Harmonic Voice Frequency Bars -->
  <!-- Bar 1 (Left Outer) -->
  <rect x="12" y="22" width="5.5" height="20" rx="2.75" fill="#10b981" fill-opacity="0.45" />

  <!-- Bar 2 (Left Mid) -->
  <rect x="21" y="15" width="5.5" height="34" rx="2.75" fill="#10b981" fill-opacity="0.75" />

  <!-- Bar 3 (Center Apex) -->
  <rect x="30" y="9" width="6" height="46" rx="3" fill="url(#emeraldGrad)" />

  <!-- Bar 4 (Right Mid) -->
  <rect x="40" y="18" width="5.5" height="28" rx="2.75" fill="#10b981" fill-opacity="0.85" />

  <!-- Bar 5 (Right Outer Telephony Channel) -->
  <rect x="49" y="25" width="5.5" height="14" rx="2.75" fill="url(#amberGrad)" />

  <!-- Telemetry Beacon -->
  <circle cx="51.75" cy="16" r="3" fill="#f59e0b" />
</svg>
